name: Deploy Bot NDI

on:
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: 'Optional retained local release SHA to roll back to'
        required: false
        type: string
        default: ''

permissions:
  actions: read
  contents: read

jobs:
  validate_release:
    name: Validate successful CI on main
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      commit_sha: ${{ steps.validate.outputs.commit_sha }}
    steps:
      # This GitHub-hosted job verifies the dispatch before the production runner is selected.
      - name: Validate dispatch and successful CI run
        id: validate
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const expectedRepository = 'Nusa-Data-Indonesia/bot-ndi';
            const fail = (message) => core.setFailed(message);
            const { owner, repo } = context.repo;

            if (context.eventName !== 'workflow_dispatch' ||
                `${owner}/${repo}` !== expectedRepository ||
                context.ref !== 'refs/heads/main' ||
                !/^[a-f0-9]{40}$/.test(context.sha)) {
              fail('Deployment must be dispatched from main in the Bot NDI repository with a full commit SHA.');
              return;
            }

            const workflows = await github.rest.actions.listRepoWorkflows({ owner, repo, per_page: 100 });
            const ciWorkflow = workflows.data.workflows.find((workflow) =>
              workflow.path === '.github/workflows/ci.yml' && workflow.name === 'CI');
            if (!ciWorkflow) {
              fail('The trusted CI workflow file could not be verified.');
              return;
            }

            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: ciWorkflow.id,
              branch: 'main',
              event: 'push',
              status: 'completed',
              per_page: 100,
            });
            const run = runs.data.workflow_runs.find((candidate) => candidate.head_sha === context.sha);
            if (!run || run.name !== 'CI' || run.path !== '.github/workflows/ci.yml' ||
                run.event !== 'push' || run.head_branch !== 'main' ||
                run.status !== 'completed' || run.conclusion !== 'success' ||
                run.repository?.full_name !== expectedRepository ||
                run.head_repository?.full_name !== expectedRepository) {
              fail('The dispatched main commit does not have a successful trusted CI push run.');
              return;
            }

            const verified = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: run.id });
            if (verified.data.head_sha !== context.sha ||
                verified.data.path !== '.github/workflows/ci.yml' ||
                verified.data.event !== 'push' || verified.data.head_branch !== 'main' ||
                verified.data.conclusion !== 'success' ||
                verified.data.repository?.full_name !== expectedRepository ||
                verified.data.head_repository?.full_name !== expectedRepository) {
              fail('GitHub API metadata does not match the successful CI run.');
              return;
            }
            core.setOutput('commit_sha', context.sha);

  deploy:
    name: Build and deploy on the Bot NDI LXC
    needs: validate_release
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.validate_release.outputs.commit_sha == github.sha
    runs-on: [self-hosted, linux, x64, bot-ndi]
    timeout-minutes: 45
    concurrency:
      group: bot-ndi-production
      cancel-in-progress: false
    environment:
      name: production
    permissions:
      contents: read
    steps:
      - name: Checkout the validated main commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate_release.outputs.commit_sha }}
          persist-credentials: false

      - name: Refuse a stale main revision
        env:
          RELEASE_COMMIT_SHA: ${{ needs.validate_release.outputs.commit_sha }}
          RELEASE_GITHUB_TOKEN: ${{ github.token }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const { checkReleaseHead } = require(`${process.env.GITHUB_WORKSPACE}/scripts/check-release-head.js`);
            await checkReleaseHead({
              repository: `${context.repo.owner}/${context.repo.repo}`,
              commit: process.env.RELEASE_COMMIT_SHA,
              token: process.env.RELEASE_GITHUB_TOKEN,
            });
            core.info('The dispatched commit remains the current main head.');

      - name: Validate local deployment toolchain
        run: |
          bash -n scripts/deploy-homelab.sh
          docker info >/dev/null
          docker compose version

      - name: Build and deploy locally
        env:
          BOT_NDI_COMMIT_SHA: ${{ needs.validate_release.outputs.commit_sha }}
          BOT_NDI_ROLLBACK_SHA: ${{ inputs.rollback_sha }}
        run: bash scripts/deploy-homelab.sh

      - name: Record deployed revision
        if: success()
        env:
          DEPLOYED_SHA: ${{ needs.validate_release.outputs.commit_sha }}
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
        run: |
          if [[ -n "$ROLLBACK_SHA" ]]; then
            printf 'Bot NDI rolled back to: %s\n' "$ROLLBACK_SHA" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Bot NDI deployed commit: %s\n' "$DEPLOYED_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi
